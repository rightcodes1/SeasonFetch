name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tauri-desktop-shell

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Tauri desktop executable
        run: npm run desktop:build
      - name: Launch app and verify UI and native IPC
        shell: pwsh
        run: ./scripts/desktop-smoke.ps1
      - name: Upload test executable
        uses: actions/upload-artifact@v4
        with:
          name: seasonfetch-test-exe-${{ github.sha }}
          path: |
            src-tauri/target/release/seasonfetch.exe
            desktop-smoke-ui.txt
          if-no-files-found: error
          retention-days: 14
