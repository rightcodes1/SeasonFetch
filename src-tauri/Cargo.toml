[package]
name = "seasonfetch"
version = "1.1.0"
description = "SeasonFetch desktop shell"
authors = ["SeasonFetch"]
edition = "2021"

[lib]
name = "seasonfetch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
