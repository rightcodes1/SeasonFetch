<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><title>Manga hardening browser check</title></head>
  <body>
    <pre id="result">RUNNING</pre>
    <div id="root"></div>
    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import MangaApp from '../MangaApp.jsx';
      import { createMockMangaProvider } from '../mockProvider.js';
      import { chapterStorageKey } from '../storage.js';

      const output = document.querySelector('#result');
      let stage = 'starting';
      const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
      const assert = (condition, message) => { if (!condition) throw new Error(message); };
      async function waitFor(predicate, message) {
        const deadline = Date.now() + 12000;
        while (Date.now() < deadline) {
          const value = await predicate();
          if (value) return value;
          await wait(25);
        }
        throw new Error(`Timed out: ${message}`);
      }
      function click(element, message) {
        assert(element, `Missing control: ${message}`);
        element.click();
      }
      function readButton(label) {
        return [...document.querySelectorAll('button')].find(button => button.textContent.trim().startsWith(label));
      }
      function deleteDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.deleteDatabase('seasonfetch-manga');
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
          request.onblocked = () => reject(new Error('Database reset was blocked.'));
        });
      }
      function readProgress(key) {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open('seasonfetch-manga', 2);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => {
            const database = request.result;
            const transaction = database.transaction(['readingProgress'], 'readonly');
            const get = transaction.objectStore('readingProgress').get(key);
            get.onsuccess = () => resolve(get.result || null);
            get.onerror = () => reject(get.error);
            transaction.oncomplete = () => database.close();
            transaction.onabort = () => reject(transaction.error);
          };
        });
      }
      function readJob(key) {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open('seasonfetch-manga', 2);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => {
            const database = request.result;
            const transaction = database.transaction(['downloadJobs'], 'readonly');
            const get = transaction.objectStore('downloadJobs').get(key);
            get.onsuccess = () => resolve(get.result || null);
            get.onerror = () => reject(get.error);
            transaction.oncomplete = () => database.close();
          };
        });
      }

      try {
        const reloaded = sessionStorage.getItem('manga-hardening-reloaded') === 'yes';
        stage = reloaded ? 'reload-offline' : 'initial-reader';
        if (!reloaded) await deleteDatabase();
        else Object.defineProperty(navigator, 'onLine', { configurable: true, value: false });

        createRoot(document.querySelector('#root')).render(React.createElement(MangaApp));

        if (!reloaded) {
          await waitFor(() => document.querySelector('.manga-work-card'), 'mock catalog render');
          click(document.querySelector('.manga-work-card'), 'open sample work');
          await waitFor(() => document.querySelectorAll('.manga-chapter-row').length === 4, 'chapter list');
          const chapterRow = [...document.querySelectorAll('.manga-chapter-row')].find(row => row.textContent.includes('Chapter 1'));
          click(chapterRow?.querySelector('.secondary-button'), 'read chapter 1');
          await waitFor(() => document.querySelector('.manga-page-image'), 'first reader page');

          for (let index = 2; index <= 4; index += 1) {
            click(readButton('Next →'), `navigate to page ${index}`);
            await waitFor(() => document.querySelector('.manga-reader-controls')?.textContent.includes(`Page ${index} `), `page ${index}`);
          }
          const provider = createMockMangaProvider();
          const chapter = await (await provider.getChapters('work-quiet-orbit')).find(item => item.id === 'chapter-orbit-1');
          const key = chapterStorageKey(chapter);
          await waitFor(async () => (await readProgress(key))?.completed === true, 'completed reading progress persistence');

          click(document.querySelector('.manga-reader-toolbar .manga-back-link'), 'return to chapters');
          await waitFor(() => document.querySelector('.manga-chapter-row'), 'chapter details');
          const reopenedRow = [...document.querySelectorAll('.manga-chapter-row')].find(row => row.textContent.includes('Chapter 1'));
          click(reopenedRow?.querySelector('.secondary-button'), 'reopen completed chapter');
          await waitFor(() => document.querySelector('.manga-reader-footnote')?.textContent.includes('Chapter marked complete.'), 'completed state after reopening');

          click(document.querySelector('.manga-reader-toolbar .manga-back-link'), 'return to download chapter');
          await waitFor(() => document.querySelector('.manga-chapter-row'), 'chapter details for download');
          const downloadRow = [...document.querySelectorAll('.manga-chapter-row')].find(row => row.textContent.includes('Chapter 1'));
          click(downloadRow?.querySelector('.primary-button'), 'download chapter');
          stage = 'download-wait';
          await waitFor(() => document.querySelector('.manga-notice')?.textContent.includes('saved for offline reading'), 'download completion');
          sessionStorage.setItem('manga-hardening-reloaded', 'yes');
          location.reload();
        } else {
          await waitFor(() => readButton('Downloads'), 'downloads navigation');
          click(readButton('Downloads'), 'open offline library');
          await waitFor(() => readButton('Clear temporary cache'), 'storage controls');
          click(readButton('Clear temporary cache'), 'clear temporary cache');
          await waitFor(() => document.querySelector('.manga-notice')?.textContent.includes('Temporary page cache cleared'), 'cache cleanup');
          click(readButton('Read offline'), 'open saved chapter offline');
          await waitFor(() => document.querySelector('.manga-page-image') && document.querySelector('.manga-reader-controls small')?.textContent.includes('OFFLINE COPY'), 'offline image after reload');
          assert(document.querySelector('.manga-reader-footnote')?.textContent.includes('Chapter marked complete.'), 'completed progress was not preserved after reload');
          output.textContent = 'PASS: actual IndexedDB progress and Blob pages persisted after reload; completed state was restored; cache cleanup preserved offline pages; saved chapter opened offline.';
        }
      } catch (error) {
        console.error(error);
        const provider = createMockMangaProvider();
        const chapter = (await provider.getChapters('work-quiet-orbit')).find(item => item.id === 'chapter-orbit-1');
        const job = await readJob(chapterStorageKey(chapter)).catch(() => null);
        output.textContent = `FAIL [${stage}] job=${JSON.stringify(job)}: ${error.stack || error.message}`;
      }
    </script>
  </body>
</html>
